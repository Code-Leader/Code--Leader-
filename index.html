const X={py:['Every programmer starts with Hello World. The print function sends text to the screen. Anything inside quotes is a string, which Python shows exactly as written. Run the line below and you have written your first program.','A variable is a labelled box that stores a value. Write the name, an equals sign, then the value. Use clear names like age or name, never start a name with a number, and remember Python is case-sensitive.','Every value has a type: str for text, int for whole numbers, float for decimals and bool for True or False. Use type to check what you have, because mixing types is a common source of errors.'],js:['The console.log function prints a message to the browser console, your best friend for testing code. Statements usually end with a semicolon. Open DevTools with F12 and run the line to see the output.','Use let for values that will change and const for values that must stay fixed. Prefer const by default. The old var keyword is best avoided in new code.','JavaScript has strings, numbers, booleans, null, undefined, arrays and objects. The typeof operator tells you the type of a value. Beware that typeof null returns object, a famous quirk.'],web:['HTML describes the structure of a page. The h1 tag marks the main heading. Tags usually come in pairs, an opening tag and a closing tag with a slash. Save your file as index.html and open it in a browser.','Paragraphs use p tags and links use the a tag with an href attribute pointing to the destination. Attributes give extra information to a tag and always go inside the opening tag.','The img tag shows a picture. The src attribute is the file location and alt is a text description used by screen readers and shown if the image fails to load. Always write a meaningful alt.'],java:['Java programs live inside classes. The System.out.println method prints a line of text. Every statement ends with a semicolon and Java is strict about spelling and capital letters.','Java needs you to declare the type of a variable first, such as int for whole numbers or String for text. Then name it and give it a value. The type cannot change later.','Primitive types include int, double, boolean and char. A double stores decimals. Choose the smallest type that fits your data, and remember that String is an object, not a primitive.'],cpp:['C++ prints with std::cout and the << operator. You must include the iostream header first. Code runs inside the main function and each statement ends with a semicolon.','Declare a variable by giving its type, name and value, for example int age = 20. C++ is statically typed, so the compiler checks types before your program ever runs.','Common types are int, double, char, bool and std::string. Each takes a different amount of memory. Use double for decimals and watch out for integer overflow.'],sql:['SQL talks to databases. SELECT chooses which columns to read and FROM names the table. The star means every column. Keywords are conventionally written in capitals.','WHERE filters rows so you only get the ones that match a condition, like age above 18. Combine conditions with AND and OR, and put quotes around text values.','ORDER BY sorts your results. Add DESC for highest first, or ASC (the default) for lowest first. You can sort by several columns, separated by commas.'],php:['PHP runs on the server and echo outputs text to the page. PHP code sits between the opening and closing PHP tags. Each statement ends with a semicolon.','PHP variables always start with a dollar sign. You do not declare a type, PHP works it out. Names are case-sensitive, so $name and $Name are different variables.','Strings can use single or double quotes, and double quotes let you place variables inside the text. Built-in functions like strlen and strtoupper save a lot of work.']};

web:['Lists organise content: ul for bullets, ol for numbers and li for each item. Tables use table, tr and td for rows and cells.','Forms collect input. Each input has a type and name, and a label helps accessibility. required stops empty submissions.','A CSS selector chooses which elements to style: by tag, by .class or by #id. Specific selectors override general ones.','Every element is a box made of content, padding, border and margin. Learning this fixes most spacing problems.','Flexbox lines items up in a row or column. Use justify-content and align-items to position them, and gap for spacing.','Grid lays out rows and columns together. Define columns with grid-template-columns for neat card layouts.','Media queries change styles by screen size. Build for phones first, then add rules for larger screens.'],
java:['Operators include + - * / and %. Integer division drops decimals, so 7 / 2 is 3 in Java. Use double for decimals.','A String is an object with helpful methods like length, charAt and toUpperCase. Strings cannot be changed once created.','An array holds a fixed number of values of one type. Indexes start at 0, and length tells you its size.','if and else choose between paths. Compare strings with equals, not ==, and group conditions with && and ||.','for loops repeat a set number of times and while loops repeat until a condition fails. Watch your start and end values.','A method is reusable code inside a class. State its return type, name and parameters, and use void when nothing returns.','Classes are blueprints and objects are the things you build from them. Fields store data and methods describe behaviour.'],

ts:['console.log prints to the console. TypeScript is JavaScript with types, so any JavaScript line already works.','Add a type after the name, like age: number. The compiler then warns you when you use the wrong kind of value.','Common types are number, string, boolean and arrays like number[]. Types catch mistakes before your code runs.','Annotate parameters and the return type so every function says what it takes and gives back.','Arrays can be typed as number[] or string[]. map, filter and push work the same as in JavaScript.','Objects group related values. TypeScript checks that you only use properties that really exist.','An interface describes the shape of an object: which properties it needs and their types.','A union type, like string | number, allows more than one kind of value in the same variable.','Classes bundle data and methods. You can mark members public or private to control access.','Generics, like T, let one function work with many types while staying type-safe.'],
cs:['Console.WriteLine prints a line of text. C# is strongly typed and every statement ends with a semicolon.','Declare a variable with its type first, such as int or string, then a name and a value.','Common types are int, double, bool, char and string. Choose double for decimals.','Operators include + - * / and %. Integer division drops decimals, so 7 / 2 is 3.','Strings have methods like ToUpper, Length and Contains. Use $ before quotes to place values inside text.','A List grows and shrinks, while an array has a fixed size. Use Add to put a new item in a List.','if, else if and else choose a path. The ternary operator gives a short one-line choice.','for repeats a set number of times and foreach walks through a collection. Check the stop condition.','A method groups reusable code. State the return type, name and parameters, or use void for none.','A class is a blueprint for objects. Fields hold data and methods describe what the object can do.'],
go:['fmt.Println prints a line. Every Go program starts in the main function inside package main.','Use var with a type, or := to let Go work out the type. := only works inside functions.','Go has int, float64, bool and string. It never converts between types automatically.','Operators work as in maths, and / on integers drops decimals. % gives the remainder.','The strings package has helpers like ToUpper, Contains and Split. Import it before using it.','A slice is a flexible list. Use append to add items, which returns a new slice.','if needs no brackets around the condition, but the braces are required.','Go has only one loop keyword, for. It can count, run while a condition holds, or loop forever.','A function lists parameter types after the names and its return type at the end.','A struct groups fields together. It is how Go models things like a car or a user.'],
rs:['println! prints a line. The exclamation mark shows it is a macro, not a normal function.','Variables are fixed by default. Add mut to allow changes, which makes bugs easier to spot.','Rust has i32, f64, bool and char. Types are usually worked out for you, but you can state them.','Operators work as in maths, and integer division drops decimals. Use braces inside println! to show values.','String owns its text and can grow, while &str is a borrowed view. String::from makes a new String.','A Vec is a growable list. Create one with vec! and add items with push.','if conditions must be true or false, with no automatic conversion from numbers.','for loops walk through a range like 0..3 or a collection. The end of a range is not included.','A function lists typed parameters and a return type after an arrow. A last line without a semicolon is returned.','A struct groups named fields into one type. You add behaviour to it with an impl block.'],
rb:['puts prints a line of text. Ruby reads almost like English and needs no semicolons.','Create a variable by writing a name, an equals sign and a value. No types are needed.','Everything in Ruby is an object, so even numbers have methods like class and to_s.','Operators work as in maths. 7 / 2 is 3 for whole numbers, so use 7.0 / 2 for decimals.','Strings have methods like upcase, reverse and length. Use #{} inside double quotes to insert values.','An array holds items in order. Use << or push to add, and each to go through them.','if, elsif and else choose a path, and every block ends with end.','times, each and while repeat code. Ruby programmers usually prefer times and each.','def starts a method and end finishes it. The last value is returned automatically.','A class is a blueprint. initialize sets up each new object, and @ marks its own values.'],
sw:['print writes a line to the screen. Swift is clean and safe, with no semicolons needed.','Use let for values that never change and var for values that do. Prefer let by default.','Common types are Int, Double, Bool and String. Swift works out the type from the value.','Operators work as in maths, and Int division drops decimals. Convert to Double for exact results.','Strings have properties and methods like count and uppercased. Put values inside text with a backslash and brackets.','An array keeps items in order. Use append to add, and square brackets to read by position.','if and else choose a path, with no brackets around the condition.','for-in loops go through a range like 0..<3 or an array. The ..< part leaves out the last number.','func defines a function. Parameters have types, and the return type comes after an arrow.','A struct groups related values and functions. Swift structs are copied when passed around.']};

const CH=[
{t:'How the Web Works',l:'js',c:'console.log("I am becoming a web developer!");',k:'Run the line, then change the message to your own name and run it again.',b:`# What is a website?

A website is a set of files kept on a computer that is always switched on and connected to the internet. That computer is the **server**. Your phone or laptop is the **client**, and the app that shows the page is the **browser**, like Chrome.

# What happens when you open a page?

Think of a restaurant. You tell the waiter what you want: that is the **request**. The kitchen prepares it and the waiter brings it back: that is the **response**. Your browser then shows it. All of this takes a fraction of a second.

# The three languages of the web

- **HTML** is the structure, like the walls and rooms of a house.
- **CSS** is the style, like paint and furniture.
- **JavaScript** is the behaviour, like lights and doors that make things happen.

# What does a web developer do?

A **front-end** developer builds what people see and touch. A **back-end** developer builds the servers and databases behind it. Someone who does both is **full-stack**. This course takes you from the first to the second.

# Your first line of code

~~~
console.log("I am becoming a web developer!");
~~~

- \`console.log\` tells the computer to print a message.
- The text inside the quotes is the message. Quotes mark it as text.
- The semicolon ends the instruction, like a full stop.`},
{t:'What is HTML?',l:'web',c:'<h1>Hello, world!</h1>\n<p>My first web page.</p>',k:'Add an `<h2>` heading that says About Me and a paragraph about yourself, then run it.',b:`# What is HTML?

HTML stands for **HyperText Markup Language**. It is not a programming language. It **marks up** text, telling the browser what each piece is: a heading, a paragraph, a picture or a link. Think of a school textbook with titles, headings and paragraphs. HTML does the same job for a web page.

# Tags: the building blocks

HTML is made of **tags**: words inside angle brackets. Most come in pairs, an **opening tag** and a **closing tag** with a slash.

~~~
<h1>Hello, world!</h1>
<p>My first web page.</p>
~~~

- \`<h1>\` opens the main heading and \`</h1>\` closes it.
- \`<p>\` opens a paragraph and \`</p>\` closes it.
- Opening tag, content and closing tag together make an **element**.

# Headings and common tags

Headings run from \`<h1>\`, the biggest, to \`<h6>\`, the smallest. Use one \`<h1>\` per page, like a book title.

- \`<p>\` a paragraph
- \`<a>\` a link
- \`<img>\` a picture
- \`<ul>\` and \`<li>\` a bulleted list`},
{t:'Your First Web Page',l:'web',c:'<h1>Ada Obi</h1>\n<p>Welcome to my first website.</p>\n<h2>My Goals</h2>\n<ul>\n  <li>Learn HTML</li>\n  <li>Learn CSS</li>\n  <li>Become a web developer</li>\n</ul>\n<a href="https://code-leader.github.io/Code--Leader-/">Visit CodeLadder</a>',k:'Change the name and goals to yours and add one more list item.',b:`# The skeleton of every page

~~~
<!DOCTYPE html>
<html>
  <head><title>My Page</title></head>
  <body>
    <h1>Welcome!</h1>
  </body>
</html>
~~~

- \`<!DOCTYPE html>\` tells the browser this page uses modern HTML.
- \`<html>\` wraps the whole page.
- \`<head>\` holds information that is not shown. \`<title>\` is the text on the browser tab.
- \`<body>\` holds everything people see.

The spaces at the start of lines are **indentation**. They are optional but make code easier to read.

# Links, pictures and lists

~~~
<a href="https://code-leader.github.io/Code--Leader-/">Visit CodeLadder</a>
<img src="photo.jpg" alt="A photo of me">
<ul><li>Learn HTML</li><li>Learn CSS</li></ul>
~~~

- \`href\`, \`src\` and \`alt\` are **attributes**: extra information inside a tag.
- \`alt\` describes the picture for screen readers. Always write one.
- \`<img>\` has no closing tag. A few tags, like \`<br>\`, do not need one.

# Common mistakes

- Forgetting the slash in a closing tag.
- Forgetting the quotes after \`href=\`.
- Writing \`<hl>\` (letter L) instead of \`<h1>\`.`},
{t:'Styling with CSS',l:'web',c:'<style>\n  body { background: #f3f6ff; font-family: Arial; padding: 20px; }\n  h1 { color: #1d4ed8; }\n  p { font-size: 20px; color: #333; }\n</style>\n<h1>Styled page</h1>\n<p>CSS makes pages beautiful.</p>',k:'Change the colours and font size, then add `text-align: center;` to the h1 rule.',b:`# What is CSS?

CSS stands for **Cascading Style Sheets**. HTML builds the page and CSS makes it beautiful: colours, fonts, spacing and layout.

# How a CSS rule works

~~~
h1 {
  color: #1d4ed8;
  font-size: 40px;
}
~~~

- \`h1\` is the **selector**: it chooses which elements to style.
- Inside the curly brackets are **declarations**.
- Each declaration is a **property** (\`color\`), a colon, a **value** (\`#1d4ed8\`) and a semicolon.

# Useful properties

- \`color\` for text colour and \`background\` for background colour
- \`font-size\` and \`font-family\` for text
- \`padding\` for space inside and \`margin\` for space outside
- \`text-align\` to centre text

CSS goes inside a \`<style>\` tag, so the page below styles itself.`},
{t:'Layout and Responsive Design',l:'web',c:'<style>\n  .row { display: flex; gap: 10px; }\n  .box { background: gold; padding: 20px; border-radius: 8px; }\n  @media (max-width: 600px) { .row { flex-direction: column; } }\n</style>\n<div class="row">\n  <div class="box">One</div>\n  <div class="box">Two</div>\n  <div class="box">Three</div>\n</div>',k:'Add a fourth box and change the gap. Then shrink your browser window to watch the layout change.',b:`# The box model

Every element is a box: **content**, then **padding** (space inside), then **border**, then **margin** (space outside). Understanding this fixes most spacing problems.

# Flexbox: putting things side by side

~~~
.row { display: flex; gap: 10px; }
.box { background: gold; padding: 20px; }
~~~

- \`display: flex\` lines the children up in a row.
- \`gap\` adds space between them.
- \`justify-content: center\` centres them.

# Responsive design

People use phones, tablets and computers. A **media query** changes the style on small screens:

~~~
@media (max-width: 600px) {
  .row { flex-direction: column; }
}
~~~

This says: on screens 600px wide or less, stack the boxes in a column. Build for phones first, then add rules for bigger screens.`},
{t:'JavaScript Basics',l:'js',c:'let name = "Ada";\nlet age = 21;\nif (age >= 18) {\n  console.log(name + " is an adult");\n}\nfunction greet(person) {\n  return "Hello, " + person + "!";\n}\nconsole.log(greet(name));\nfor (let i = 1; i <= 3; i++) {\n  console.log("Round " + i);\n}',k:'Change age to 15 and see what happens, then write a second function of your own.',b:`# Why JavaScript?

HTML and CSS make a page that looks good but does nothing. **JavaScript** makes it think and react: calculating, deciding and responding to clicks.

# Variables, decisions, functions and loops

~~~
let name = "Ada";
let age = 21;
if (age >= 18) {
  console.log(name + " is an adult");
}
function greet(person) {
  return "Hello, " + person + "!";
}
console.log(greet(name));
for (let i = 1; i <= 3; i++) {
  console.log("Round " + i);
}
~~~

- \`let\` creates a **variable**, a labelled box that stores a value.
- \`if\` makes a **decision**. The code in the braces runs only if the condition is true.
- \`function\` packages code you can reuse. \`return\` sends a result back.
- \`for\` is a **loop**. It repeats code: start at 1, continue while \`i <= 3\`, add 1 each time.`},
{t:'JavaScript Meets the Page',l:'web',c:'<button id="b">Click me</button>\n<p id="msg">Waiting...</p>\n<script>\n  document.getElementById("b").onclick = function () {\n    document.getElementById("msg").textContent = "You clicked!";\n  };\n<\/script>',k:'Add a second button that changes the message to something different.',b:`# The DOM and events

The browser turns your HTML into a tree of objects called the **DOM**. JavaScript can find any element and change it, and it can listen for **events** like clicks.

~~~
<button id="b">Click me</button>
<p id="msg">Waiting...</p>
<script>
  document.getElementById("b").onclick = function () {
    document.getElementById("msg").textContent = "You clicked!";
  };
<\/script>
~~~

- \`getElementById("b")\` finds the element whose id is b.
- \`onclick\` says what to do when it is clicked.
- \`textContent\` changes the words inside an element.
- The \`<script>\` tag holds your JavaScript inside the page.

This is how buttons, menus, forms and games on websites work.`},
{t:'Git and GitHub',l:'',c:'',k:'Do this now: publish the page you built in Chapter 3 on GitHub Pages and send the link to a friend.',b:`# Why Git and GitHub?

**Git** saves versions of your project so you can go back if you break something. **GitHub** keeps those versions online and can publish your website for free with **GitHub Pages**. This is exactly how CodeLadder is published.

# The basic commands

~~~
git init
git add .
git commit -m "My first version"
git push
~~~

- \`git init\` starts tracking a folder.
- \`git add .\` picks all changed files.
- \`git commit -m "..."\` saves a version with a message.
- \`git push\` uploads it to GitHub.

# Publish your first site

- Create a free account at github.com and a new public repository.
- Upload your \`index.html\` with Add file, then Upload files.
- Open Settings, then Pages, choose the main branch and save.
- After a minute your site is live at yourname.github.io/repository.`},
{t:'Backend and Databases',l:'sql',c:'SELECT name, city FROM users WHERE age >= 18;',k:'The practice table is users (id, name, age, city). Change the condition to find people in Lagos: `WHERE city = "Lagos"`.',b:`# What is the back end?

When you log in or buy something, the page cannot remember you alone. A **server** receives the request, checks a **database**, and sends a response. The most common server languages are JavaScript (Node.js), Python and PHP, all of which you can learn on CodeLadder.

# What is a database?

A database stores information in **tables**, like a spreadsheet: each row is one record and each column is one detail. **SQL** is the language you use to ask a database for information.

~~~
SELECT name, city FROM users WHERE age >= 18;
~~~

- \`SELECT name, city\` chooses which columns you want.
- \`FROM users\` says which table.
- \`WHERE age >= 18\` keeps only the adults.

# APIs

Programs also talk to each other through **APIs**. Your site asks an API for data, usually in a format called **JSON**, and shows it on the page.`},
{t:'Projects, Portfolio and Your First Job',l:'web',c:'<h1>Ada Obi</h1>\n<p>Web developer from Lagos.</p>\n<h2>My projects</h2>\n<ul><li>My first web page</li></ul>\n<a href="mailto:you@example.com">Contact me</a>',k:'Make it yours, style it with CSS from Chapter 4, then publish it on GitHub Pages.',b:`# Build, show, earn

Learning is not finished until you have built things. Three projects to build now:

- **A personal portfolio**: your name, about you, your projects and how to contact you.
- **A business page**: a landing page for a shop or small business near you.
- **A small tool**: a calculator, to-do list or quiz using JavaScript.

# Your portfolio skeleton

~~~
<h1>Ada Obi</h1>
<p>Web developer from Lagos.</p>
<h2>My projects</h2>
<ul><li>My first web page</li></ul>
<a href="mailto:you@example.com">Contact me</a>
~~~

# Getting your first work

- Publish every project on GitHub Pages and keep the links in one place.
- Offer to build a page for a local business, for free or cheaply, to get your first example.
- Share your work on WhatsApp status, LinkedIn and X, and keep improving.
- Keep learning: React for bigger apps, Node.js for back ends, and any language on CodeLadder.`}];

{t:'Forms, Tables and Semantic HTML',l:'web',c:'<h2>Join our class</h2>\n<form>\n  <label>Name: <input type="text" placeholder="Your name"></label><br><br>\n  <label>Email: <input type="email"></label><br><br>\n  <select><option>HTML</option><option>CSS</option></select><br><br>\n  <textarea placeholder="Message"></textarea><br>\n  <button>Submit</button>\n</form>\n<table border="1" cellpadding="6">\n  <tr><th>Language</th><th>Used for</th></tr>\n  <tr><td>HTML</td><td>Structure</td></tr>\n</table>',k:'Add one more row to the table and a second dropdown choice to the form.',b:`# Forms: collecting information

Forms let visitors send you information: sign-ups, messages and orders. A form is built from small controls.

~~~
<form>
  <label>Name: <input type="text"></label>
  <label>Email: <input type="email"></label>
  <select><option>HTML</option><option>CSS</option></select>
  <textarea placeholder="Message"></textarea>
  <button>Submit</button>
</form>
~~~

- \`<form>\` wraps all the controls.
- \`<input>\` is a box to type in. Its \`type\` changes it: text, email, password, number.
- \`<label>\` names a control and makes it easier to tap.
- \`<select>\` makes a dropdown and \`<textarea>\` a bigger text box.
- \`<button>\` sends the form.

# Tables: rows and columns

~~~
<table border="1">
  <tr><th>Language</th><th>Used for</th></tr>
  <tr><td>HTML</td><td>Structure</td></tr>
</table>
~~~

- \`<tr>\` is a row, \`<th>\` a heading cell and \`<td>\` a normal cell.

# Semantic tags

Tags like \`<header>\`, \`<nav>\`, \`<main>\`, \`<section>\` and \`<footer>\` describe the **meaning** of each part of a page. They help search engines and screen readers understand it.`},
{t:'Colours, Fonts and CSS Grid',l:'web',c:'<style>\n  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }\n  .card { background: #1d4ed8; color: white; padding: 20px; border-radius: 10px; font-family: Georgia, serif; }\n  .card:hover { background: #f5c44a; color: #111; }\n</style>\n<div class="grid">\n  <div class="card">One</div><div class="card">Two</div><div class="card">Three</div>\n  <div class="card">Four</div><div class="card">Five</div><div class="card">Six</div>\n</div>',k:'Change the grid to 2 columns, pick new colours, and hover over a card to see the effect.',b:`# Colours

CSS colours can be names (\`red\`), hex codes (\`#1d4ed8\`) or \`rgb(29, 78, 216)\`. Pick two or three colours and use them everywhere so your site looks professional.

# Fonts

\`font-family\` chooses the typeface. List fallbacks in case the first is missing: \`font-family: Georgia, serif;\`.

# CSS Grid

Flexbox works in one direction. **Grid** lays out rows and columns together, perfect for card layouts.

~~~
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}
~~~

- \`display: grid\` turns on grid layout.
- \`repeat(3, 1fr)\` makes three equal columns.
- \`gap\` is the space between cells.
- \`:hover\` styles an element while the mouse is over it.`},
{t:'Project 1: Your Personal Portfolio',l:'web',c:'<style>\n  body { font-family: Arial; max-width: 600px; margin: auto; padding: 20px; background: #f3f6ff; }\n  h1 { color: #1d4ed8; }\n  .card { background: white; padding: 16px; border-radius: 10px; margin: 10px 0; }\n</style>\n<h1>Ada Obi</h1>\n<p>Web developer from Lagos.</p>\n<div class="card"><h3>My first web page</h3><p>Built with HTML and CSS.</p></div>\n<div class="card"><h3>Click counter</h3><p>Built with JavaScript.</p></div>\n<a href="mailto:you@example.com">Contact me</a>',k:'Make this portfolio yours: your name, your projects, your colours. Then publish it in Chapter 12.',b:`# Put it all together

You now know HTML, CSS and JavaScript basics. Time to build something real: a page about **you**. Employers and clients love a portfolio.

# What to include

- A **header** with your name and one line about you.
- An **about** section.
- A **projects** section with one card per project.
- A **contact** link, such as email or WhatsApp.

# Build it in three steps

- **Structure first:** write the HTML with no styling.
- **Style it:** add colours, spacing and a card layout with CSS.
- **Check on your phone:** most visitors will use one.

The page below is a starting point. Make it your own.

You have now finished **Part 1**. You can build and style real web pages. Part 2 adds data, Git, servers and databases.`},
{t:'JavaScript Arrays and Objects',l:'js',c:'let skills = ["HTML", "CSS"];\nskills.push("JavaScript");\nconsole.log(skills.length, skills[0]);\nlet student = { name: "Ada", age: 21, skills: skills };\nconsole.log(student.name + " knows " + student.skills.join(", "));\nlet doubled = [1, 2, 3].map(function (n) { return n * 2; });\nconsole.log(doubled);',k:'Add a new skill to the array, add a city property to the student, and print both.',b:`# Arrays: lists of things

An **array** holds many values in order. Counting starts at 0, so the first item is position 0.

~~~
let skills = ["HTML", "CSS"];
skills.push("JavaScript");
console.log(skills.length, skills[0]);
~~~

- \`push\` adds an item to the end.
- \`length\` says how many items there are.
- \`skills[0]\` reads the first item.

# Objects: describing one thing

An **object** groups related details as key and value pairs.

~~~
let student = { name: "Ada", age: 21 };
console.log(student.name);
~~~

# Array methods

\`map\` makes a new array by changing every item, and \`filter\` keeps only the items you want. Real websites use arrays of objects for products, posts and users.`},
{t:'Working with Data: JSON and APIs',l:'js',c:`let text = '{"name":"Ada","age":21,"skills":["HTML","CSS"]}';\nlet person = JSON.parse(text);\nconsole.log(person.name);\nconsole.log(person.skills[1]);\nconsole.log(JSON.stringify({ city: "Lagos" }));`,k:'Add a new key to the JSON text, such as "city", and print it.',b:`# What is JSON?

**JSON** is a simple text format for sending data between programs. It looks like a JavaScript object, but it is just text until you convert it.

~~~
let person = JSON.parse('{"name":"Ada","age":21}');
console.log(person.name);
~~~

- \`JSON.parse\` turns JSON text into an object.
- \`JSON.stringify\` turns an object back into text.

# What is an API?

An **API** lets one program ask another for data. Your page asks, and the server replies with JSON.

~~~
fetch("https://api.example.com/users")
  .then(r => r.json())
  .then(data => console.log(data));
~~~

- \`fetch\` sends the request.
- \`r.json()\` turns the reply into an object.
- \`then\` runs when the answer arrives, because it takes time.

This is how weather apps, news feeds and payment pages work.`},
{t:'Mini Project: To-Do App',l:'web',c:'<h2>My To-Do List</h2>\n<input id="t" placeholder="New task">\n<button onclick="add()">Add</button>\n<ul id="list"></ul>\n<script>\nfunction add() {\n  var v = document.getElementById("t").value;\n  if (v === "") return;\n  var li = document.createElement("li");\n  li.textContent = v;\n  document.getElementById("list").appendChild(li);\n  document.getElementById("t").value = "";\n}\n<\/script>',k:'Type a few tasks and press Add. Then try to add a button next to each task that removes it.',b:`# Your first real app

A to-do list uses everything you know: HTML for the page, CSS for style and JavaScript for behaviour.

# How it works

~~~
function add() {
  var v = document.getElementById("t").value;
  if (v === "") return;
  var li = document.createElement("li");
  li.textContent = v;
  document.getElementById("list").appendChild(li);
}
~~~

- Read what the user typed from the input box.
- \`if (v === "") return;\` stops if it is empty.
- \`createElement("li")\` makes a new list item in memory.
- \`appendChild\` puts it on the page.

# Ideas to extend it

- Clear the input after adding.
- Add a button that removes a task.
- Click a task to cross it out.`},
{t:'Forms and Validation',l:'web',c:'<input id="e" placeholder="Email">\n<input id="p" type="password" placeholder="Password">\n<button onclick="check()">Sign up</button>\n<p id="out"></p>\n<script>\nfunction check() {\n  var e = document.getElementById("e").value;\n  var p = document.getElementById("p").value;\n  var out = document.getElementById("out");\n  if (!e.includes("@")) { out.textContent = "Enter a valid email."; return; }\n  if (p.length < 6) { out.textContent = "Password needs 6 or more characters."; return; }\n  out.textContent = "Looks good!";\n}\n<\/script>',k:'Add a rule that the password must contain a number, and show a message if it does not.',b:`# Why validate?

People make typing mistakes, and some try to break your site. **Validation** checks the data before using it.

# Checking input with JavaScript

~~~
if (!e.includes("@")) {
  out.textContent = "Enter a valid email.";
  return;
}
if (p.length < 6) {
  out.textContent = "Password needs 6 or more characters.";
  return;
}
~~~

- \`includes("@")\` checks the text contains an @ sign.
- \`p.length\` counts the characters.
- \`!\` means not.
- \`return\` stops the function when something is wrong.

# An important rule

Browser checks help the user, but they can be bypassed. A real site must **also** check on the server.`},
{t:'How Servers and APIs Work',l:'js',c:'function handle(path) {\n  if (path === "/") return "Welcome to CodeLadder";\n  if (path === "/courses") return JSON.stringify(["HTML", "CSS", "JavaScript"]);\n  return "404 Not Found";\n}\nconsole.log(handle("/"));\nconsole.log(handle("/courses"));\nconsole.log(handle("/nothing"));',k:'Add a new route called /about that returns a message about you.',b:`# Request and response

Every page load is a **request** from the browser and a **response** from the server. The server looks at the address, called the **route**, and decides what to send back.

# Status codes

- **200** means OK.
- **404** means not found.
- **500** means the server had an error.

# Verbs

- **GET** asks for data.
- **POST** sends new data, like a sign-up form.

# A real server in Node.js

~~~
const express = require("express");
const app = express();
app.get("/", (req, res) => res.send("Hello"));
app.listen(3000);
~~~

- \`app.get("/")\` handles requests to the home route.
- \`res.send\` sends the reply.
- \`app.listen(3000)\` starts the server.

This runs on a computer or hosting service, not in the browser terminal. The terminal example above shows the same idea in plain JavaScript.`},
{t:'Introduction to React',l:'',c:'',k:'Read the example, then write the same heading in plain HTML. Notice how React removes repetition when you need many of them.',b:`# Why React?

As websites grow, plain JavaScript gets messy. **React** is a popular library for building interfaces from small reusable pieces called **components**. Many employers ask for it.

# A component

~~~
function Welcome(props) {
  return <h1>Hello, {props.name}!</h1>;
}
~~~

- A component is a function that returns what to show.
- The HTML-looking part is called **JSX**.
- \`props\` are inputs, so one component can show many names.
- Curly brackets \`{}\` insert JavaScript values.

# State

**State** is data that changes and updates the screen automatically, such as a counter or a list of tasks. React redraws only the parts that changed.

# When to learn it

Learn React after you are comfortable with JavaScript. Tools like Vite create a project in minutes, and you can run it on your computer or publish it on GitHub Pages.`},
{t:'Mini Project: Business Landing Page',l:'web',c:'<style>\n  body { margin: 0; font-family: Arial; }\n  .hero { background: #0a1230; color: white; text-align: center; padding: 60px 20px; }\n  .hero button { background: #f5c44a; border: 0; padding: 12px 24px; border-radius: 8px; font-size: 16px; }\n  .features { display: flex; gap: 10px; padding: 20px; flex-wrap: wrap; }\n  .features div { flex: 1; min-width: 150px; background: #f3f6ff; padding: 16px; border-radius: 10px; }\n</style>\n<div class="hero"><h1>Mama Tee Bakery</h1><p>Fresh bread every morning in Ikeja.</p><button>Order now</button></div>\n<div class="features"><div>Fresh daily</div><div>Fast delivery</div><div>Fair prices</div></div>',k:'Change it into a landing page for a real business near you: new name, colours and three features.',b:`# The page that earns money

A **landing page** has one job: get the visitor to take one action, like calling, ordering or signing up. Small businesses pay developers for these.

# Plan before you code

- Who is it for?
- What do they get?
- What is the one action you want them to take?

# The usual sections

- **Hero:** a big headline, one line of explanation and one clear button.
- **Features:** three short reasons to choose the business.
- **Contact:** phone, WhatsApp or a map.

# Tips

- Use one main button and make it stand out.
- Keep the words short.
- Test on a phone first.`}];
